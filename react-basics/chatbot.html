<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <style>
      body {
        font-family: Arial;
        margin:0;
      }
      
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        margin-left: 10px;
        font-size: 15px;
      }
      .send-button:hover {
        background-color: rgb(21, 110, 69);  
        cursor: pointer;
      }

      .chat-input {
        padding:12px 15px;
        border-width:1px;
        border-radius: 10px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display:flex;
        margin-bottom: 60px;
      }

      .app-container {
        margin-left: auto;
        margin-right:auto;
        max-width:600px;
        height:100vh;
        display:flex;
        flex-direction: column;
      }

      .chat-massage-user {
        display:flex;
        justify-content: flex-end;
      }
      .chat-message-robot {
        display:flex;
        justify-content: flex-start;
      }

      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right:10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .chat-message-profile {
        width:45px;
        height:45px;
      }

      .chat-messages-container {
        flex-grow: 1;
        margin-top:20px;
        overflow: scroll;
        scrollbar-width: none;
      }

      .welcome-message {
        color:gray;
        text-align: center;
      }

      .loading-image {
        height:40px;
        margin: -15px;
      }
    </style>
    <script type="text/babel">

      //Chat-Eingabe
      function ChatInput({chatMessages, setChatMessages}) {
        const [inputText, setInputText] = React.useState('');
        const [isLoading, setIsLoading] = React.useState('');
        
        function saveInputText(event) {
            setInputText(event.target.value);
        }

        function handleKeyDown(event) {
          if (event.key === 'Enter') {
            sendMessage();
          } else if (event.key === 'Escape') {
            setInputText('');
          }
        }

        async function sendMessage() {
          if (isLoading || inputText === '') return;
          
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];

          setChatMessages(newChatMessages);
          setInputText('');

          //Ladeanzeige
          setIsLoading(true);

          setChatMessages([
            ...newChatMessages,
            {
              message: <img className="loading-image" src="https://supersimple.dev/images/loading-spinner.gif" />,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          //Chatbot-Antwort
          const response = await Chatbot.getResponseAsync(inputText);

          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          setIsLoading(false);
        }

        return (
          <div className="chat-input-container">
            <input 
              placeholder="Prompt eingeben..."
              size="30" 
              onChange={saveInputText} 
              onKeyDown={handleKeyDown}
              value={inputText}
              className="chat-input"
            />
            <button 
              onClick={sendMessage}
              className="send-button">
              Send
            </button>
          </div>
        );
      }

      //Chat-Nachricht
      function ChatMessage({message, sender}) {
        return (
          <div className={sender === 'user' ? 'chat-massage-user' : 'chat-message-robot'}>
            {sender === 'robot' && <img className="chat-message-profile" src="robot.png" />}
            <div className="chat-message-text">
              {message}
            </div>
            {sender === 'user' && <img className="chat-message-profile" src="user.png" />}
          </div>
        );
      }

      //Alle Chat-Nachrichten
      function ChatMessages({chatMessages}) {
        const chatMessagesRef = React.useRef(null);
        React.useEffect(() => {
          const containerElement = chatMessagesRef.current;
          if (containerElement) {
            containerElement.scrollTop = containerElement.scrollHeight;
          }
        }, [chatMessages]);

        return (
          <div className="chat-messages-container"
          ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return <ChatMessage 
                message={chatMessage.message} 
                sender={chatMessage.sender} 
                key={chatMessage.id}
              />
            })}
          </div>
        );
      }
      
      //App
      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);

        return (
          <div className="app-container">
            {chatMessages.length === 0 ? (<p className="welcome-message">Welcome to the chatbot project! Send a message using the textbox below.</p>) : ""}
            <ChatMessages 
              chatMessages = {chatMessages}
              setChatMessages = {setChatMessages}
            />
            <ChatInput 
              chatMessages = {chatMessages}
              setChatMessages = {setChatMessages}
            />
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
