<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body style="font-family: Arial;">
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
      //Zähler Button
      function CounterButton({count, setCount}) {

        function buttonClicked() {
          setCount(count + 1);
        }

        return (
          <button 
            onClick={buttonClicked}>Clicked {count} {count === 1 ? 'time' : 'times'}
          </button>
        );
      }

      //App
      function App() {

        let [count, setCount] = React.useState(0);
        function resetCount() {
          setCount(0);
        }

        const [inputText, setInputText] = React.useState('');
        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function resetName() {
          setInputText('');
        }

        function exampleName() {
          setInputText('Bernd');
        }

        return (
          <>
            <CounterButton 
              count = {count} 
              setCount = {setCount} 
            />
            <CounterButton 
              count = {count} 
              setCount = {setCount} 
            />
            <button onClick={resetCount}>Reset</button>
            <br /><br /><br />
            <input onChange={saveInputText} placeholder="Type a name here" value={inputText}/>
            <p>Hello {inputText}</p>
            <button onClick={resetName}>Reset</button>
            <button onClick={exampleName}>Example</button>
          </>
        );
      }
      
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
