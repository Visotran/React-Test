<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body style="font-family: Arial;">
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
      

      function ProductDetails({imageSrc, name, price, discountPrice}) {
        return (  
          <>
            <img src={imageSrc} width="150"/>
            <p>{name}</p>
            {discountPrice ? <del>Price: {price}</del> : <p>Price: {price}</p>}
            {discountPrice && <p>Discount price: {discountPrice}</p>}
            <button>
              Add to cart
            </button>
            <br /><br /><br />
          </>
        );
      }

      function App() {
        return (
          <>
            <ProductDetails 
              imageSrc="https://supersimple.dev/images/cotton-socks.png"
              name="Cotton socks" 
              price="$10.90" 
              discountPrice="$5.45" 
            />
            <ProductDetails 
              imageSrc="https://supersimple.dev/images/tennis-balls.png"
              name="Tennis balls" 
              price="$6.00"
            />
            <ProductDetails 
              imageSrc="https://supersimple.dev/images/plain-t-shirt.png"
              name="Plain T-Shirt" 
              price="$7.99"
            />
          </>
        )
      }
      
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
